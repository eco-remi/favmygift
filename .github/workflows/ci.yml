name: SSO CI

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]

permissions:
    contents: read

jobs:
    symfony-tests:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: postgres_test
                ports:
                    - 5432/tcp
                options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
        steps:
            - name: Checkout
              uses: actions/checkout@v3

            - name: PHP setup
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  tools: phpunit-bridge
                  extensions: pgsql

            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@v3
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-

            - name: Install Dependencies
              run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --optimize-autoloader

            - name: Migrations / DB init
              run: |
                composer require --dev symfony/orm-pack
                php bin/console doctrine:migrations:migrate --env=test || echo "No migrations found or migration failed"
              env:
                DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?serverVersion=16&charset=UTF-8

            - name: Tests (via PHPUnit)
              run: vendor/bin/phpunit
              env:
                DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?serverVersion=16&charset=UTF-8
                SYMFONY_DEPRECATIONS_HELPER: "disabled=1"
